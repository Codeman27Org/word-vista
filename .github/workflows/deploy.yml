name: Deploy

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Validate levels
        run: npm run validate-levels
      - name: Build
        run: npm run build
      - name: Set AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload hashed assets
        env:
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
        run: >
          aws s3 sync dist/assets "s3://${SITE_BUCKET}/assets"
          --delete
          --cache-control "public, max-age=31536000, immutable"
      - name: Upload site files
        env:
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
        run: >
          aws s3 sync dist/ "s3://${SITE_BUCKET}"
          --delete
          --exclude "assets/*"
          --cache-control "no-cache"
      - name: Set manifest content type
        env:
          SITE_BUCKET: ${{ secrets.SITE_BUCKET }}
        run: >
          aws s3 cp dist/manifest.webmanifest
          "s3://${SITE_BUCKET}/manifest.webmanifest"
          --content-type "application/manifest+json"
          --cache-control "no-cache"
      - name: Invalidate CloudFront
        env:
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
