<!doctype html>
<!--
  Word Vista — static visual reference (NOT app code).
  Open in a browser. Shows Home, Levels map, Game (mid-swipe) and Level Complete.
  CSS tokens, sizes and the scene algorithm here match docs/02-visual-design.md.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Word Vista — Design Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ink: #2b2b3a;
    --ink-soft: #5a5a70;
    --glass: rgba(255, 255, 255, 0.88);
    --glass-strong: rgba(255, 255, 255, 0.95);
    --glass-weak: rgba(255, 255, 255, 0.28);
    --shadow-1: 0 2px 0 rgba(0, 0, 0, 0.14);
    --shadow-2: 0 10px 28px rgba(0, 0, 0, 0.22);
    --gold: #f5b82e;
    --gold-dark: #c98a0c;
    --danger: #e5484d;
    --radius-card: 22px;
    --accent: #2e9e5b;
    --accent-dark: color-mix(in srgb, var(--accent) 78%, black);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #1d1f2b; font-family: var(--font); color: var(--ink); padding: 32px; }
  h1.page { color: #fff; font-weight: 900; margin: 0 0 6px; }
  p.page { color: #b9bdd6; margin: 0 0 24px; font-weight: 700; }
  .frames { display: flex; flex-wrap: wrap; gap: 32px; }
  .frame-label { color: #cfd3ea; font-weight: 800; margin: 0 0 10px; letter-spacing: .04em; }

  /* ---------- phone shell (mockup only) ---------- */
  .phone { position: relative; width: 390px; height: 844px; border-radius: 44px; overflow: hidden;
           box-shadow: 0 0 0 10px #0d0e15, 0 30px 60px rgba(0,0,0,.5); user-select: none; }
  .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column;
            padding: 44px 0 24px; /* safe areas */ }

  /* ---------- shared controls ---------- */
  .icon { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.6;
          stroke-linecap: round; stroke-linejoin: round; }
  .round-btn { position: relative; width: 52px; height: 52px; border-radius: 50%; border: 0;
               background: var(--glass); color: var(--accent-dark); box-shadow: var(--shadow-1), var(--shadow-2);
               display: grid; place-items: center; cursor: pointer; }
  .round-btn .icon { width: 26px; height: 26px; }
  .badge { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
           background: var(--gold); color: #fff; font-weight: 900; font-size: 12px; line-height: 1;
           padding: 4px 7px; border-radius: 999px; box-shadow: 0 2px 0 var(--gold-dark); white-space: nowrap; }
  .count-badge { position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; border-radius: 11px;
                 background: var(--accent); color: #fff; font-size: 12px; font-weight: 900;
                 display: grid; place-items: center; padding: 0 5px; box-shadow: 0 2px 0 var(--accent-dark); }
  .meter-ring { position: absolute; inset: -3px; width: 58px; height: 58px; transform: rotate(-90deg); }
  .coin-pill { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.28); color: #fff;
               font-weight: 900; font-size: 16px; padding: 5px 12px 5px 5px; border-radius: 999px; }
  .coin { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffe28a, var(--gold) 60%, var(--gold-dark));
          box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
  .pill-btn { border: 0; border-radius: 999px; background: var(--accent); color: #fff; font-family: var(--font);
              font-weight: 900; font-size: 22px; letter-spacing: .04em; padding: 14px 34px;
              box-shadow: 0 5px 0 var(--accent-dark), var(--shadow-2); cursor: pointer; }
  .pill-btn.secondary { background: var(--glass-strong); color: var(--accent-dark); box-shadow: 0 4px 0 rgba(0,0,0,.15); font-size: 16px; padding: 10px 20px; }

  /* ---------- top bar ---------- */
  .topbar { height: 56px; display: grid; grid-template-columns: 56px 1fr auto; align-items: center; padding: 0 14px; color: #fff; }
  .topbar .back { width: 42px; height: 42px; border-radius: 50%; border: 0; background: rgba(0,0,0,.25); color: #fff; display: grid; place-items: center; }
  .title { text-align: center; line-height: 1.05; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .title .area { display: block; font-size: 12px; font-weight: 800; letter-spacing: .14em; opacity: .9; }
  .title .level { display: block; font-size: 20px; font-weight: 900; letter-spacing: .04em; }

  /* ---------- crossword grid ---------- */
  .grid-area { flex: 1; display: grid; place-items: center; padding: 12px 18px; min-height: 0; }
  .grid { display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); grid-template-rows: repeat(var(--rows), var(--cell));
          gap: var(--gap); }
  .cell { border-radius: calc(var(--cell) * .18); background: var(--glass); box-shadow: var(--shadow-1);
          display: grid; place-items: center; font-weight: 900; font-size: calc(var(--cell) * .62); line-height: 1; color: transparent; }
  .cell.filled { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-dark); }
  .cell.hinted { background: var(--glass-strong); color: var(--accent); }

  /* ---------- word preview ---------- */
  .preview-row { height: 56px; display: grid; place-items: center; }
  .preview { background: var(--accent); color: #fff; font-weight: 900; font-size: 28px; letter-spacing: .12em;
             padding: 4px 18px 4px 22px; border-radius: 14px; box-shadow: 0 4px 0 var(--accent-dark), var(--shadow-2); }

  /* ---------- wheel ---------- */
  .wheel-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; padding: 0 12px; }
  .side { display: flex; flex-direction: column; gap: 22px; align-items: center; padding-bottom: 14px; }
  .wheel { position: relative; width: var(--d); height: var(--d); border-radius: 50%; background: rgba(255,255,255,.82);
           box-shadow: var(--shadow-2), inset 0 -4px 0 rgba(0,0,0,.06); touch-action: none; }
  .wheel svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .wheel .line { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round; opacity: .92; }
  .letter { position: absolute; transform: translate(-50%, -50%); display: grid; place-items: center; border-radius: 50%;
            font-weight: 900; color: var(--ink); }
  .letter.selected { background: var(--accent); color: #fff; }

  /* ---------- compliment ---------- */
  .compliment { position: absolute; left: 0; right: 0; top: 46%; text-align: center; font-size: 40px; font-weight: 900; color: #fff;
                -webkit-text-stroke: 2px var(--accent-dark); text-shadow: 0 4px 0 var(--accent-dark), 0 8px 20px rgba(0,0,0,.3); pointer-events: none; }

  /* ---------- home ---------- */
  .home { align-items: center; }
  .home .top { width: 100%; display: flex; justify-content: flex-end; padding: 8px 16px; }
  .logo { margin-top: 70px; text-align: center; color: #fff; }
  .logo .w1 { font-size: 60px; font-weight: 900; letter-spacing: .02em; line-height: .9; text-shadow: 0 5px 0 rgba(0,0,0,.18), 0 10px 30px rgba(0,0,0,.25); }
  .logo .tiles { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
  .logo .tiles span { width: 46px; height: 46px; border-radius: 9px; background: var(--accent); color: #fff; font-size: 30px; font-weight: 900;
                      display: grid; place-items: center; box-shadow: 0 4px 0 var(--accent-dark); }
  .home .pack-label { margin-top: auto; color: #fff; font-weight: 800; letter-spacing: .14em; font-size: 13px; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .play-btn { margin-top: 12px; width: 230px; display: flex; flex-direction: column; align-items: center; line-height: 1; gap: 6px; padding: 18px 0; }
  .play-btn small { font-size: 14px; letter-spacing: .12em; opacity: .9; }
  .home .bottom { display: flex; gap: 18px; margin: 34px 0 30px; }

  /* ---------- map ---------- */
  .map-list { flex: 1; overflow: hidden; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px; }
  .area-card { background: var(--glass-strong); border-radius: var(--radius-card); padding: 14px; box-shadow: var(--shadow-2); }
  .area-card h3 { margin: 0 0 10px; font-size: 18px; font-weight: 900; letter-spacing: .06em; display: flex; justify-content: space-between; }
  .area-card h3 small { font-size: 13px; color: var(--ink-soft); font-weight: 800; }
  .pack-row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; padding: 6px 0; }
  .pack-row .swatch { width: 44px; height: 44px; border-radius: 12px; }
  .pack-row .name { font-weight: 900; }
  .bar { height: 8px; border-radius: 4px; background: rgba(0,0,0,.08); margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .pack-row .meta { font-weight: 800; color: var(--ink-soft); font-size: 13px; }
  .pack-row.locked { opacity: .45; }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 6px 2px 2px; }
  .lvl { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: 16px; }
  .lvl.done { background: var(--accent); color: #fff; box-shadow: 0 3px 0 var(--accent-dark); }
  .lvl.current { background: #fff; color: var(--accent-dark); box-shadow: 0 0 0 4px var(--accent), 0 3px 10px rgba(0,0,0,.2); }
  .lvl.locked { background: rgba(0,0,0,.08); color: rgba(0,0,0,.3); }

  /* ---------- overlay ---------- */
  .scrim { position: absolute; inset: 0; background: rgba(10, 14, 30, .45); backdrop-filter: blur(2px); display: grid; place-items: center; }
  .card { width: 320px; background: var(--glass-strong); border-radius: 28px; padding: 26px 22px 24px; text-align: center; box-shadow: var(--shadow-2); }
  .card .big { font-size: 44px; font-weight: 900; color: var(--accent); line-height: 1; margin: 4px 0 8px; }
  .card .sub { font-weight: 800; letter-spacing: .12em; color: var(--ink-soft); font-size: 13px; }
  .reward { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 26px; font-weight: 900; margin: 18px 0 6px; }
  .reward-note { font-weight: 800; color: var(--ink-soft); font-size: 14px; margin-bottom: 20px; }
  .found-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 14px 0 0; }
  .chip { background: rgba(0,0,0,.06); border-radius: 999px; padding: 4px 10px; font-weight: 900; font-size: 13px; letter-spacing: .06em; }
</style>
</head>
<body>
<h1 class="page">Word Vista — visual reference</h1>
<p class="page">390×844 logical px (iPhone 12–15). All scenes are generated SVG; no photos. Accent color changes per area.</p>

<div class="frames">
  <div><p class="frame-label">1 · HOME (Desert · Dusk)</p><div class="phone" id="home"></div></div>
  <div><p class="frame-label">2 · LEVELS MAP (Forest · Night)</p><div class="phone" id="map"></div></div>
  <div><p class="frame-label">3 · GAME, MID-SWIPE (Meadow · Dawn)</p><div class="phone" id="game"></div></div>
  <div><p class="frame-label">4 · LEVEL COMPLETE (Lagoon · Day)</p><div class="phone" id="complete"></div></div>
</div>

<script>
/* ===== Scene generator: reference implementation of docs/02-visual-design.md §Scenes ===== */
function createRng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const rgbToHex = (c) => "#" + c.map((v) => Math.round(v).toString(16).padStart(2, "0")).join("");
const mix = (a, b, t) => { const A = hexToRgb(a), B = hexToRgb(b); return rgbToHex(A.map((v, i) => v + (B[i] - v) * t)); };

const SKIES = {
  dawn:  { top: "#6c7bd0", bottom: "#ffc1a1", body: "sun",  bodyColor: "#ffe2a8", x: 300, y: 430, r: 46, darkness: 0.08 },
  day:   { top: "#3e8edb", bottom: "#cdebff", body: "sun",  bodyColor: "#fff4c9", x: 310, y: 160, r: 40, darkness: 0 },
  dusk:  { top: "#40306e", bottom: "#ff8c66", body: "sun",  bodyColor: "#ffb070", x: 110, y: 440, r: 50, darkness: 0.22 },
  night: { top: "#0c1638", bottom: "#34497f", body: "moon", bodyColor: "#f1f3ff", x: 90,  y: 140, r: 30, darkness: 0.55 },
};
const AREAS = {
  meadow:  { name: "Meadow",  accent: "#2e9e5b", shapes: ["hills", "hills", "hills"],          colors: ["#9cc9b0", "#6dae7f", "#3f8a57"] },
  canyon:  { name: "Canyon",  accent: "#d0602a", shapes: ["mesas", "mesas", "dunes"],          colors: ["#e3b48c", "#cf8558", "#a2552f"] },
  forest:  { name: "Forest",  accent: "#1f7a5c", shapes: ["mountains", "pines", "pines"],      colors: ["#8fb5b0", "#4f8574", "#2c5e4a"] },
  lagoon:  { name: "Lagoon",  accent: "#1a8fb5", shapes: ["mountains", "hills", "water"],      colors: ["#93b9c9", "#5e9e8c", "#3c8db0"] },
  desert:  { name: "Desert",  accent: "#c2701c", shapes: ["dunes", "dunes", "dunes"],          colors: ["#f0cf9a", "#e2ae6c", "#c98842"] },
};
const LAYER_BASE = [520, 600, 690], LAYER_AMP = [110, 80, 55], LAYER_HAZE = [0.35, 0.15, 0];
const NIGHT_INK = "#0b1026";

function ridge(shape, baseY, amp, rng) {
  const p1 = rng() * 6.28, p2 = rng() * 6.28, pts = [];
  if (shape === "mountains" || shape === "mesas") {
    // control points then linear interpolation
    const ctrl = []; let x = -20, high = true;
    while (x < 440) {
      if (shape === "mountains") { ctrl.push([x, high ? 0.55 + rng() * 0.45 : 0.1 + rng() * 0.3]); x += 40 + rng() * 50; }
      else { const top = 0.8 + rng() * 0.2, w = 50 + rng() * 60, low = 0.2 + rng() * 0.15, gap = 30 + rng() * 30;
             ctrl.push([x, low], [x + 10, top], [x + 10 + w, top], [x + 20 + w, low]); x += 20 + w + gap; }
      high = !high;
    }
    for (let px = 0; px <= 400; px += 8) {
      let i = 0; while (i < ctrl.length - 2 && ctrl[i + 1][0] < px) i++;
      const [x0, n0] = ctrl[i], [x1, n1] = ctrl[i + 1], t = Math.min(1, Math.max(0, (px - x0) / (x1 - x0 || 1)));
      pts.push([px, baseY - amp * (n0 + (n1 - n0) * t)]);
    }
  } else {
    for (let px = 0; px <= 400; px += 8) {
      let n;
      if (shape === "dunes") n = 0.35 + 0.35 * Math.sin(0.016 * px + p1) + 0.15 * Math.sin(0.041 * px + p2);
      else if (shape === "pines") n = 0.2 + 0.12 * Math.sin(0.011 * px + p1) + 0.08 * Math.sin(0.027 * px + p2);
      else if (shape === "water") n = 0;
      else n = 0.5 + 0.3 * Math.sin(0.011 * px + p1) + 0.2 * Math.sin(0.027 * px + p2);
      pts.push([px, baseY - amp * Math.max(0, Math.min(1, n))]);
    }
  }
  return pts;
}

function renderScene(svg, areaId, tod, seed) {
  const NS = "http://www.w3.org/2000/svg", area = AREAS[areaId], sky = SKIES[tod], rng = createRng(seed);
  const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  svg.setAttribute("viewBox", "0 0 400 800"); svg.setAttribute("preserveAspectRatio", "xMidYMax slice"); svg.innerHTML = "";
  const id = "sky" + seed + tod;
  const g = el("linearGradient", { id, x1: 0, y1: 0, x2: 0, y2: 1 }, el("defs", {}));
  el("stop", { offset: "0", "stop-color": sky.top }, g); el("stop", { offset: "1", "stop-color": sky.bottom }, g);
  el("rect", { x: 0, y: 0, width: 400, height: 800, fill: `url(#${id})` });
  if (sky.body === "moon") {
    for (let i = 0; i < 40; i++) el("circle", { cx: rng() * 400, cy: rng() * 450, r: 0.6 + rng(), fill: "#fff", opacity: 0.5 + rng() * 0.5 });
  }
  el("circle", { cx: sky.x, cy: sky.y, r: sky.r * 2.4, fill: sky.bodyColor, opacity: 0.22 });
  el("circle", { cx: sky.x, cy: sky.y, r: sky.r, fill: sky.bodyColor });
  area.shapes.forEach((shape, i) => {
    const color = mix(mix(area.colors[i], sky.bottom, LAYER_HAZE[i]), NIGHT_INK, sky.darkness);
    const pts = ridge(shape, LAYER_BASE[i], LAYER_AMP[i], rng);
    el("path", { d: "M0,800 " + pts.map(([x, y]) => `L${x},${y.toFixed(1)}`).join(" ") + " L400,800 Z", fill: color });
    if (shape === "pines") {
      for (let x = 0; x < 400; x += 9 + rng() * 7) {
        const yb = pts[Math.round(x / 8)][1] + 2, h = (18 + rng() * 20) * (0.8 + i * 0.25), w = 5 + rng() * 4;
        el("path", { d: `M${x - w},${yb} L${x},${yb - h} L${x + w},${yb} Z`, fill: color });
      }
    }
    if (shape === "water") {
      for (let k = 0; k < 6; k++) {
        const y = LAYER_BASE[i] + 10 + rng() * (800 - LAYER_BASE[i] - 20), x = rng() * 360, w = 40 + rng() * 100;
        el("rect", { x, y, width: w, height: 2, rx: 1, fill: mix(color, "#ffffff", 0.3), opacity: 0.5 });
      }
    }
  });
}

/* ===== helpers ===== */
const ICONS = {
  back: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',
  shuffle: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 7h3c4 0 6 10 10 10h3M4 17h3c1.6 0 2.8-1.6 4-3.6M13 9.6C14.2 8 15.4 7 17 7h3M17 4l3 3-3 3M17 14l3 3-3 3"/></svg>',
  hint: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>',
  star: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>',
  gear: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>',
  map: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>',
  lock: '<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
};
function phone(id, areaId, tod, seed) {
  const root = document.getElementById(id);
  root.style.setProperty("--accent", AREAS[areaId].accent);
  root.innerHTML = '<svg class="scene"></svg><div class="screen"></div>';
  renderScene(root.querySelector(".scene"), areaId, tod, seed);
  return root.querySelector(".screen");
}
function topbar(area, level, coins) {
  return `<header class="topbar"><button class="back">${ICONS.back}</button>
    <div class="title"><span class="area">${area}</span><span class="level">${level}</span></div>
    <div class="coin-pill"><span class="coin"></span>${coins}</div></header>`;
}
// words: [WORD,row,col,dir('A'|'D')]; filled: set of found words; hinted: ["r,c"]
function gridHtml(rows, cols, words, found, hinted, cell) {
  const cells = new Map();
  words.forEach(([w, r, c, d]) => [...w].forEach((ch, i) => {
    const rr = d === "D" ? r + i : r, cc = d === "A" ? c + i : c, k = rr + "," + cc;
    const prev = cells.get(k) || { ch, filled: false };
    prev.filled ||= found.includes(w); cells.set(k, prev);
  }));
  const gap = Math.max(3, Math.round(cell * 0.08));
  let html = `<div class="grid" style="--rows:${rows};--cols:${cols};--cell:${cell}px;--gap:${gap}px">`;
  for (const [k, v] of cells) {
    const [r, c] = k.split(",").map(Number);
    const cls = v.filled ? "filled" : hinted.includes(k) ? "hinted" : "";
    html += `<div class="cell ${cls}" style="grid-row:${r + 1};grid-column:${c + 1}">${v.ch}</div>`;
  }
  return html + "</div>";
}
// Wheel geometry per docs §Wheel: radius ring = D/2 * (n<=3 ? 0.6 : 0.68); start at top, clockwise.
function wheelHtml(letters, selected, pointer, D) {
  const n = letters.length, ring = (D / 2) * (n <= 3 ? 0.6 : 0.68);
  const pos = letters.map((_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [D / 2 + ring * Math.cos(a), D / 2 + ring * Math.sin(a)]; });
  const hit = Math.min(D * 0.14, 0.9 * ring * Math.sin(Math.PI / n));
  const linePts = selected.map((i) => pos[i]).concat(pointer ? [pointer] : []);
  let html = `<div class="wheel" style="--d:${D}px"><svg><polyline class="line" stroke-width="${(D * 0.035).toFixed(1)}" points="${linePts.map((p) => p.join(",")).join(" ")}"/></svg>`;
  letters.forEach((L, i) => {
    html += `<div class="letter ${selected.includes(i) ? "selected" : ""}" style="left:${pos[i][0]}px;top:${pos[i][1]}px;width:${hit * 2}px;height:${hit * 2}px;font-size:${(D * 0.17).toFixed(0)}px">${L}</div>`;
  });
  return html + "</div>";
}
function meterRing(progress) {
  const c = 2 * Math.PI * 26;
  return `<svg class="meter-ring" viewBox="0 0 58 58"><circle cx="29" cy="29" r="26" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="4"/>
    <circle cx="29" cy="29" r="26" fill="none" stroke="var(--gold)" stroke-width="4" stroke-linecap="round" stroke-dasharray="${c * progress} ${c}"/></svg>`;
}
